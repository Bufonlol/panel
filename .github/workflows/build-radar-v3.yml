name: Build Radar Local V3

on:
  push:
    branches:
      - radar-local-host
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: radar-local-host

      - name: Build V3 bundle
        run: node build-radar-v3.cjs

      - name: Smoke test Radar API
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://zurfsqmqiwjnakkdsdlk.supabase.co/functions/v1/radar-api?action=businesses&city=Orizaba&limit=1000';
          const res = await fetch(url, { headers: { 'x-radar-device': 'radar-ci-smoke-device-000000000001' } });
          const text = await res.text();
          if (!res.ok) {
            console.error('Radar API failed:', res.status, text.slice(0, 1000));
            process.exit(1);
          }
          let body;
          try { body = JSON.parse(text); } catch {
            console.error('Radar API returned invalid JSON');
            process.exit(1);
          }
          if (!Array.isArray(body.businesses) || body.businesses.length === 0) {
            console.error('Radar API returned no businesses');
            process.exit(1);
          }
          console.log(`Radar API OK: ${body.businesses.length} businesses returned`);
          NODE

      - name: Commit dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'build: update Radar Local V3 dist'
          git pull --rebase origin radar-local-host
          git push origin radar-local-host
