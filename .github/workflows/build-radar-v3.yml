name: Build Radar Local

on:
  push:
    branches:
      - radar-local-host
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-local-host-build
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: radar-local-host

      - name: Build Radar bundle
        run: node build-radar-v3.cjs

      - name: Commit dist
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f dist/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'build: update Radar Local dist'
          git pull --rebase origin radar-local-host
          git push origin radar-local-host
