name: Radar V8.4 source one-shot

on:
  push:
    branches: [radar-local-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 1

      - name: Persist V8.4 source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          weekly=Path('weekly-prospecting-os-v8.js')
          s=weekly.read_text(encoding='utf-8')
          s,n=re.subn(r"(\{dow:'Lunes',name:'Cafeterías'.*?,target:)6(\},)",r"\g<1>10\2",s,count=1)
          if n==0 and 'target:10' not in s: raise SystemExit('Monday target not found')
          s=s.replace('top=list.slice(0,8)','top=list.slice(0,10)',1)
          s=s.replace('Math.min(8,list.length)','Math.min(10,list.length)',1)
          weekly.write_text(s,encoding='utf-8')

          idx=Path('index.html')
          s=idx.read_text(encoding='utf-8')
          if '<option>9</option><option>10</option>' not in s:
            pat=re.compile(r'(<select id="routeStops"[^>]*>.*?<option>8</option>)(</select>)',re.S)
            s,n=pat.subn(r'\1<option>9</option><option>10</option>\2',s,count=1)
            if n!=1: raise SystemExit('routeStops select not found')
          idx.write_text(s,encoding='utf-8')

          build=Path('build-radar-v3.cjs')
          s=build.read_text(encoding='utf-8')
          load="vm.runInThisContext(fs.readFileSync('deep-research-playbook-patch-v8_4.js','utf8'),{filename:'deep-research-playbook-patch-v8_4.js'});"
          if load not in s:
            anchor="vm.runInThisContext(fs.readFileSync('manual-rental-clients-patch-v8_3.js','utf8'),{filename:'manual-rental-clients-patch-v8_3.js'});"
            s=s.replace(anchor,anchor+'\n'+load,1)
          apply="html=window.patchRadarDeepPlaybooksV84(html);"
          if apply not in s:
            anchor='html=window.patchRadarManualRentalsV83(html);'
            s=s.replace(anchor,anchor+'\n'+apply,1)
          validation="if(!html.includes('v84OpenBusinessPlaybook')||!html.includes('radarDeepPlaybooksV84'))throw new Error('V8.4 deep researched playbooks missing');"
          if validation not in s:
            anchor="if(!html.includes('radarManualRentalsV83')||!html.includes('+ Cliente manual'))throw new Error('V8.3 manual rental clients missing');"
            s=s.replace(anchor,anchor+'\n'+validation,1)
          s=s.replace("console.log('Radar Local V8.3 built:'","console.log('Radar Local V8.4 built:'")
          build.write_text(s,encoding='utf-8')

          # Build locally as a guard. The regular build workflow will publish dist from the source commit.
          import subprocess
          subprocess.run(['node','build-radar-v3.cjs'],check=True)
          out=Path('dist/index.html').read_text(encoding='utf-8')
          checks=['target:10','top=list.slice(0,10)','Math.min(10,list.length)','v84OpenBusinessPlaybook','radarDeepPlaybooksV84','<option>9</option><option>10</option>']
          missing=[x for x in checks if x not in out]
          if missing: raise SystemExit('Missing from built bundle: '+', '.join(missing))
          print('V8.4 source and bundle validation OK')

      - name: Publish durable source changes
        run: |
          rm -f .github/workflows/radar-v84-source-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly-prospecting-os-v8.js index.html build-radar-v3.cjs deep-research-playbook-patch-v8_4.js .github/workflows/radar-v84-source-once.yml
          git commit -m 'feat: persist Radar V8.4 researched proposals and 10-stop routes'
          git pull --rebase origin radar-local-host
          git push origin HEAD:radar-local-host
