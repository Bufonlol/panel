name: Radar 10-stop one-shot patch

on:
  push:
    branches:
      - radar-local-host

permissions:
  contents: write

jobs:
  patch-radar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hosting branch
        uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 1

      - name: Update Monday target and route limits
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('dist/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text, count = re.subn(
              r"(\{dow:'Lunes',name:'Cafeterías'.*?,target:)6(\},)",
              r"\g<1>10\2",
              text,
              count=1,
          )
          if count == 0 and "name:'Cafeterías'" in text and "target:10" not in text:
              raise SystemExit('Could not locate Monday cafeteria target')

          if 'top=list.slice(0,8)' in text:
              text = text.replace('top=list.slice(0,8)', 'top=list.slice(0,10)', 1)
          elif 'top=list.slice(0,10)' not in text:
              raise SystemExit('Could not locate weekly prospect display limit')

          if 'Math.min(8,list.length)' in text:
              text = text.replace('Math.min(8,list.length)', 'Math.min(10,list.length)', 1)
          elif 'Math.min(10,list.length)' not in text:
              raise SystemExit('Could not locate V8 route stop clamp')

          route_pattern = re.compile(r'(<select id="routeStops"[^>]*>.*?<option>8</option>)(</select>)', re.S)
          if '<option>9</option><option>10</option>' not in text:
              text, count = route_pattern.subn(r'\1<option>9</option><option>10</option>\2', text, count=1)
              if count != 1:
                  raise SystemExit('Could not extend routeStops options')

          legacy_old = '.sort((a,z)=>z.p.priority-a.p.priority).slice(0,8);if(rows.length<2)'
          legacy_new = '.sort((a,z)=>z.p.priority-a.p.priority).slice(0,10);if(rows.length<2)'
          if legacy_old in text:
              text = text.replace(legacy_old, legacy_new, 1)

          if text == original:
              print('Radar frontend already had the 10-stop update.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Radar frontend updated to 10 stops.')

      - name: Remove one-shot workflow and publish
        run: |
          rm -f .github/workflows/radar-target-10-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.html
          git add -u .github/workflows/radar-target-10-once.yml
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "fix: raise Radar cafeteria route to 10 visits"
          git push origin HEAD:radar-local-host
