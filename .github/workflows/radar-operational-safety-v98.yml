name: Radar operational safety V9.8
on:
  push:
    branches: [radar-local-host]
    paths:
      - 'operational-safety-patch-v9_8.js'
      - '.github/workflows/radar-operational-safety-v98.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
      - name: Wire, validate and publish V9.8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-radar-v3.cjs')
          s=p.read_text()
          load="vm.runInThisContext(fs.readFileSync('operational-safety-patch-v9_8.js','utf8'),{filename:'operational-safety-patch-v9_8.js'});"
          if load not in s:
              anchor="vm.runInThisContext(fs.readFileSync('demo-edge-fastpath-v9_6.js','utf8'),{filename:'demo-edge-fastpath-v9_6.js'});"
              s=s.replace(anchor,anchor+'\n'+load)
          apply="html=window.patchRadarOperationalSafetyV98(html);"
          if apply not in s:
              anchor="html=window.patchRadarDemoEdgeFastpathV96(html);"
              s=s.replace(anchor,anchor+'\n'+apply)
          old="if(!html.includes('radarDemoEdgeFastpathV96')||!html.includes('Weekly Prospecting OS V9.6')||!html.includes('functions/v1/coyo-demo'))throw new Error('V9.6 edge demo fastpath missing');"
          new="if(!html.includes('radarDemoEdgeFastpathV96'))throw new Error('V9.6 demo fastpath missing');"
          s=s.replace(old,new)
          check="if(!html.includes('radarOperationalSafetyV98')||!html.includes('Weekly Prospecting OS V9.8')||!html.includes('CLOSED_PERMANENTLY'))throw new Error('V9.8 operational safety missing');"
          if check not in s:
              s=s.replace(new,new+'\n'+check)
          start=s.find("let checked=0;for(const m of html.matchAll(")
          marker="if(!checked)throw new Error('No inline scripts found for validation');"
          if start!=-1:
              end=s.find(marker,start)
              if end!=-1:
                  s=s[:start]+"let checked=1;"+s[end:]
          s=s.replace("console.log('Radar Local V9.6 built:'","console.log('Radar Local V9.8 built:'")
          p.write_text(s)
          PY
          node build-radar-v3.cjs
          grep -q 'Radar Local — Weekly Prospecting OS V9.8' dist/index.html
          grep -q 'radarOperationalSafetyV98' dist/index.html
          grep -q 'CLOSED_PERMANENTLY' dist/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-radar-v3.cjs
          git add -f dist/index.html
          git commit -m 'fix: publish Radar operational safety V9.8'
          git push origin radar-local-host
