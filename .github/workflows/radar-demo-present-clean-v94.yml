name: Radar demo present clean V9.4
on:
  push:
    branches: [radar-local-host]
    paths:
      - 'demo-present-clean-v9_4.js'
      - '.github/workflows/radar-demo-present-clean-v94.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
      - name: Wire, validate and publish V9.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-radar-v3.cjs')
          s=p.read_text()
          load="vm.runInThisContext(fs.readFileSync('demo-present-clean-v9_4.js','utf8'),{filename:'demo-present-clean-v9_4.js'});"
          if load not in s:
              anchor="vm.runInThisContext(fs.readFileSync('demo-open-hardfix-v9_3.js','utf8'),{filename:'demo-open-hardfix-v9_3.js'});"
              s=s.replace(anchor,anchor+'\n'+load)
          apply="html=window.patchRadarDemoPresentCleanV94(html);"
          if apply not in s:
              anchor="html=window.patchRadarDemoOpenHardfixV93(html);"
              s=s.replace(anchor,anchor+'\n'+apply)
          s=s.replace("if(!html.includes('radarDemoOpenHardfixV93')||!html.includes('Weekly Prospecting OS V9.3')||!html.includes('stopImmediatePropagation'))throw new Error('V9.3 demo hardfix missing');","if(!html.includes('radarDemoOpenHardfixV93')||!html.includes('stopImmediatePropagation'))throw new Error('V9.3 demo hardfix missing');")
          check="if(!html.includes('radarDemoPresentCleanV94')||!html.includes('Weekly Prospecting OS V9.4')||!html.includes('coyo-direct-present'))throw new Error('V9.4 direct presentation missing');"
          if check not in s:
              anchor="if(!html.includes('radarDemoOpenHardfixV93')||!html.includes('stopImmediatePropagation'))throw new Error('V9.3 demo hardfix missing');"
              s=s.replace(anchor,anchor+'\n'+check)
          s=s.replace("console.log('Radar Local V9.3 built:'","console.log('Radar Local V9.4 built:'")
          p.write_text(s)
          PY
          node build-radar-v3.cjs
          grep -q 'Radar Local — Weekly Prospecting OS V9.4' dist/index.html
          grep -q 'radarDemoPresentCleanV94' dist/index.html
          grep -q 'coyo-direct-present' dist/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-radar-v3.cjs
          git add -f dist/index.html
          git commit -m 'fix: publish direct demo presentation V9.4'
          git push origin radar-local-host
