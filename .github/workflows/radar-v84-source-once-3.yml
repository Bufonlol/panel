name: Radar V8.4 source one-shot 3

on:
  push:
    branches: [radar-local-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 5
      - name: Patch validate and publish sources
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re, subprocess
          p=Path('weekly-prospecting-os-v8.js'); s=p.read_text(encoding='utf-8')
          s,n=re.subn(r"(\{dow:'Lunes',name:'Cafeterías'.*?,target:)6(\},)",r"\g<1>10\2",s,count=1)
          if n==0 and 'target:10' not in s: raise SystemExit('Monday target not found')
          s=s.replace('top=list.slice(0,8)','top=list.slice(0,10)',1).replace('Math.min(8,list.length)','Math.min(10,list.length)',1); p.write_text(s,encoding='utf-8')
          p=Path('route-planner-patch-v6_2.js'); s=p.read_text(encoding='utf-8')
          old='<option>7</option><option>8</option></select>'; new='<option>7</option><option>8</option><option>9</option><option>10</option></select>'
          if new not in s:
            if old not in s: raise SystemExit('Route options not found')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('build-radar-v3.cjs'); s=p.read_text(encoding='utf-8')
          load="vm.runInThisContext(fs.readFileSync('deep-research-playbook-patch-v8_4.js','utf8'),{filename:'deep-research-playbook-patch-v8_4.js'});"
          if load not in s:
            a="vm.runInThisContext(fs.readFileSync('manual-rental-clients-patch-v8_3.js','utf8'),{filename:'manual-rental-clients-patch-v8_3.js'});"; s=s.replace(a,a+'\n'+load,1)
          apply='html=window.patchRadarDeepPlaybooksV84(html);'
          if apply not in s:
            a='html=window.patchRadarManualRentalsV83(html);'; s=s.replace(a,a+'\n'+apply,1)
          val="if(!html.includes('v84OpenBusinessPlaybook')||!html.includes('radarDeepPlaybooksV84'))throw new Error('V8.4 deep researched playbooks missing');"
          if val not in s:
            a="if(!html.includes('radarManualRentalsV83')||!html.includes('+ Cliente manual'))throw new Error('V8.3 manual rental clients missing');"; s=s.replace(a,a+'\n'+val,1)
          s=s.replace("console.log('Radar Local V8.3 built:'","console.log('Radar Local V8.4 built:'"); p.write_text(s,encoding='utf-8')
          subprocess.run(['node','build-radar-v3.cjs'],check=True)
          out=Path('dist/index.html').read_text(encoding='utf-8')
          for x in ['target:10','top=list.slice(0,10)','Math.min(10,list.length)','v84OpenBusinessPlaybook','radarDeepPlaybooksV84','<option>9</option><option>10</option>']:
            if x not in out: raise SystemExit('Validation missing '+x)
          print('Validated V8.4')
          PY
          rm -f .github/workflows/radar-v84-source-once.yml .github/workflows/radar-v84-source-once-2.yml .github/workflows/radar-v84-source-once-3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly-prospecting-os-v8.js route-planner-patch-v6_2.js build-radar-v3.cjs deep-research-playbook-patch-v8_4.js .github/workflows/radar-v84-source-once.yml .github/workflows/radar-v84-source-once-2.yml .github/workflows/radar-v84-source-once-3.yml
          git commit -m 'feat: persist Radar V8.4 researched proposals and 10-stop routes'
          git restore --worktree dist/index.html || true
          git pull --rebase origin radar-local-host
          git push origin HEAD:radar-local-host
