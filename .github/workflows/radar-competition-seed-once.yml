name: Radar competition research seed once

on:
  push:
    branches:
      - radar-local-host

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 5
      - name: Wire research seed and publish
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p=Path('build-radar-v3.cjs')
          s=p.read_text(encoding='utf-8')
          load="vm.runInThisContext(fs.readFileSync('competition-research-seed-patch-v8_5_1.js','utf8'),{filename:'competition-research-seed-patch-v8_5_1.js'});"
          if load not in s:
              anchor="vm.runInThisContext(fs.readFileSync('competition-analysis-patch-v8_5.js','utf8'),{filename:'competition-analysis-patch-v8_5.js'});"
              if anchor not in s: raise SystemExit('competition load anchor missing')
              s=s.replace(anchor,anchor+'\n'+load,1)
          apply="html=window.patchRadarCompetitionResearchV851(html);"
          if apply not in s:
              anchor='html=window.patchRadarCompetitionV85(html);'
              if anchor not in s: raise SystemExit('competition apply anchor missing')
              s=s.replace(anchor,anchor+'\n'+apply,1)
          val="if(!html.includes('radarCompetitionResearchV851')||!html.includes('research-echodas')||!html.includes('research-ccreativa'))throw new Error('V8.5.1 researched competition seed missing');"
          if val not in s:
              anchor="if(!html.includes('competitionView')||!html.includes('radarCompetitionV85')||!html.includes('Competencia'))throw new Error('V8.5 competition analysis missing');"
              if anchor not in s: raise SystemExit('competition validation anchor missing')
              s=s.replace(anchor,anchor+'\n'+val,1)
          s=s.replace("console.log('Radar Local V8.5 built:'","console.log('Radar Local V8.5.1 built:'")
          p.write_text(s,encoding='utf-8')
          PY
          node build-radar-v3.cjs
          grep -q 'radarCompetitionResearchV851' dist/index.html
          grep -q 'research-echodas' dist/index.html
          grep -q 'research-ccreativa' dist/index.html
          grep -q 'research-orizabaweb' dist/index.html
          rm -f .github/workflows/radar-competition-seed-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-radar-v3.cjs competition-research-seed-patch-v8_5_1.js .github/workflows/radar-competition-seed-once.yml
          git add -f dist/index.html
          git commit -m 'feat: preload researched competition in Radar'
          git pull --rebase origin radar-local-host
          git push origin HEAD:radar-local-host
