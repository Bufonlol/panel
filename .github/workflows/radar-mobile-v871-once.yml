name: Radar mobile field UX V8.7.1 once
on:
  push:
    branches: [radar-local-host]
    paths:
      - 'mobile-field-ux-patch-v8_7_1.js'
      - '.github/workflows/radar-mobile-v871-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
      - name: Wire safe mobile patch and build
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='build-radar-v3.cjs';
          let s=fs.readFileSync(p,'utf8');
          const load="vm.runInThisContext(fs.readFileSync('mobile-field-ux-patch-v8_7_1.js','utf8'),{filename:'mobile-field-ux-patch-v8_7_1.js'});";
          if(!s.includes(load)) s=s.replace("vm.runInThisContext(fs.readFileSync('coyo-demo-patch-v8_6.js','utf8'),{filename:'coyo-demo-patch-v8_6.js'});", "vm.runInThisContext(fs.readFileSync('coyo-demo-patch-v8_6.js','utf8'),{filename:'coyo-demo-patch-v8_6.js'});\n"+load);
          if(!s.includes('html=window.patchRadarMobileFieldV871(html);')) s=s.replace('html=window.patchRadarCoyoDemosV86(html);','html=window.patchRadarCoyoDemosV86(html);\nhtml=window.patchRadarMobileFieldV871(html);');
          const test="if(!html.includes('radarMobileFieldV871')||!html.includes('v871-more-grid')||!html.includes('Radar Local V8.7'))throw new Error('V8.7 mobile field UX missing');";
          if(!s.includes("V8.7 mobile field UX missing")) s=s.replace("if(!html.includes('radarCoyoDemosV86')||!html.includes('Demo COYO')||!html.includes('coyoDemoModal'))throw new Error('V8.6 COYO prospect demos missing');", "if(!html.includes('radarCoyoDemosV86')||!html.includes('Demo COYO')||!html.includes('coyoDemoModal'))throw new Error('V8.6 COYO prospect demos missing');\n"+test);
          s=s.replace(/Radar Local V8\.6 built:/g,'Radar Local V8.7 built:');
          fs.writeFileSync(p,s);
          NODE
          node build-radar-v3.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-radar-v3.cjs
          git add -f dist/index.html
          git commit -m "feat: publish Radar mobile UX V8.7" || exit 0
          git push
