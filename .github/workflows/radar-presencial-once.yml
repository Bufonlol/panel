name: Radar presencial proposal one-shot

on:
  push:
    branches:
      - radar-local-host

permissions:
  contents: write

jobs:
  patch-radar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 1

      - name: Add presencial sales playbooks
        shell: python
        run: |
          from pathlib import Path

          path = Path('dist/index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          marker = "function open(i){const p=proposal(i);document.getElementById('v82ProposalTitle').textContent=p.title;document.getElementById('v82ProposalBody').innerHTML=body(p);document.getElementById('v82ProposalModal').classList.add('on')}"

          field_code = r'''const FIELD_PLAYBOOKS=[
          {opening:'Hola, estoy trabajando con cafeterías locales para que clientes que ya compraron vuelvan más seguido. No vengo a cambiarles su sistema; quería ver si algo de esto les serviría.',questions:['¿Cómo hacen hoy para que un cliente que ya vino regrese?','¿Tienen puntos, tarjeta de cliente frecuente o promociones medibles?','¿Los pedidos y dudas llegan directo por WhatsApp o dependen de redes/apps?'],offers:[['FIDELIZACIÓN','QR en mostrador + visitas/puntos + recompensa. Es la propuesta principal.'],['QUICK WIN','Menú/QR + botón de WhatsApp + promociones visibles. Menor fricción para empezar.'],['RECURRENCIA','Cumpleaños, promociones y campañas a clientes registrados con panel básico.']],demo:['Abrir el QR desde tu teléfono.','Mostrar cómo se registra una visita o beneficio.','Enseñar el panel y una promoción de ejemplo.','Cerrar enseñando el contacto/pedido por WhatsApp.'],close:'Si esto les hace sentido, puedo prepararles una versión con su marca y probar primero el flujo más sencillo. ¿Con quién podría revisar una demo de 10 minutos?',avoid:'No empieces hablando de React, Supabase, hosting o “una página web”. Vende regreso de clientes y contacto directo.'},
          {opening:'Hola, desarrollo sistemas para clínicas pequeñas. Ya trabajo con flujos de agenda y seguimiento; quería entender cómo manejan confirmaciones y cancelaciones antes de enseñarles algo.',questions:['¿Cómo confirman las citas hoy?','¿Qué hacen cuando alguien cancela o no responde?','¿Recepción usa una sola agenda o varias herramientas?'],offers:[['AGENDA OPERATIVA','Agenda por doctor/consultorio con estados y prevención de cruces.'],['WHATSAPP','Confirmaciones, cancelaciones y recordatorios para quitar trabajo manual.'],['SEGUIMIENTO','Pacientes pendientes de reprogramar, controles y métricas de asistencia.']],demo:['Mostrar agenda del día.','Crear una cita de ejemplo.','Enseñar confirmación/cancelación.','Mostrar seguimiento y dashboard.'],close:'Si me explican su proceso actual, les puedo enseñar exactamente cómo quedaría aplicado a recepción sin obligarlos a cambiar todo de golpe.',avoid:'No prometas reducción de ausencias ni ahorros específicos sin medirlos. Enfócate en organización y menos trabajo repetitivo.'},
          {opening:'Hola, estoy adaptando una agenda sencilla para negocios que trabajan por cita. La idea es quitar mensajes repetitivos y ayudar a que la clienta vuelva para su siguiente servicio.',questions:['¿Las citas las llevan principalmente por WhatsApp?','¿Quién manda recordatorios?','¿Cómo saben cuándo una clienta debería volver para retoque o mantenimiento?'],offers:[['AGENDA','Citas, horarios y ficha básica de cliente.'],['RECORDATORIOS','Confirmación y recordatorios sin escribir uno por uno.'],['RECOMPRA','Re-agendado y promociones para la siguiente visita.']],demo:['Agendar una cita desde el teléfono.','Mostrar recordatorio/confirmación.','Abrir ficha de cliente.','Enseñar próxima visita o promoción.'],close:'Puedo montarles primero el flujo de agenda y recordatorios; si sí les ahorra trabajo, después agregamos recompra y promociones.',avoid:'Si ya usan una app de agenda que les funciona, no intentes reemplazarla: pregunta qué sigue siendo manual.'},
          {opening:'Hola, ayudo a comercios locales a mostrar mejor lo que venden y recibir cotizaciones por WhatsApp sin montar una tienda en línea complicada.',questions:['¿La gente les pregunta disponibilidad o precios por WhatsApp?','¿Tienen un catálogo fácil de mandar?','¿Qué datos necesitan antes de poder cotizar?'],offers:[['CATÁLOGO','Productos/trabajos por categorías, fotos y detalles desde celular.'],['COTIZADOR','Formulario que pide medidas, modelo, fotos o datos antes de enviar WhatsApp.'],['SEGUIMIENTO','Registro simple de solicitudes para que no se pierdan cotizaciones.']],demo:['Abrir catálogo móvil.','Elegir un producto/servicio.','Llenar una solicitud de ejemplo.','Mostrar cómo llega preparada a WhatsApp.'],close:'Si me dicen qué información piden siempre antes de cotizar, puedo armarles un ejemplo con 5 productos o servicios reales para que vean el flujo.',avoid:'No lo vendas como e-commerce si realmente venden por cotización. La promesa es menos ida y vuelta antes de dar precio.'},
          {opening:'Hola, desarrollo sistemas pequeños para organizar citas y seguimiento. Quería entender cómo llevan hoy la agenda y los controles antes de proponerles algo.',questions:['¿Trabajan principalmente con cita?','¿Quién manda recordatorios o confirmaciones?','¿Qué servicios necesitan que el cliente o paciente repita después?'],offers:[['AGENDA','Citas, horarios y estados en una sola vista.'],['RECORDATORIOS','Confirmaciones y avisos operativos.'],['CONTINUIDAD','Próxima visita/control y seguimiento administrativo.']],demo:['Mostrar agenda diaria.','Crear cita de ejemplo.','Cambiar estado de atención.','Mostrar próxima visita y recordatorio.'],close:'La idea sería empezar sólo por agenda y seguimiento administrativo. Si les sirve, se amplía después según su operación.',avoid:'No presentes funciones médicas o clínicas que no existan. Mantén la conversación en agenda, recepción y seguimiento.'}
          ];
          function fieldBody(i,p){const f=FIELD_PLAYBOOKS[Math.max(0,Math.min(FIELD_PLAYBOOKS.length-1,Number(i)||0))];return '<section class="v82-section"><div class="v82-tag">MODO VISITA PRESENCIAL</div><h4>Cómo entrar</h4><div class="v82-close">'+esc(f.opening)+'</div></section><section class="v82-section"><h4>Antes de ofrecer, pregunta esto</h4><div class="v82-includes">'+f.questions.map((q,n)=>'<div class="v82-item"><b>Pregunta '+(n+1)+'</b>'+esc(q)+'</div>').join('')+'</div></section><section class="v82-section"><h4>3 propuestas que puedes poner sobre la mesa</h4><div class="v82-value">'+f.offers.map(x=>'<div><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>').join('')+'</div><p style="font-size:8px;color:var(--muted);margin:8px 0 0">Después de detectar el problema, aterriza el precio usando las opciones comerciales de abajo: '+esc(p.sale)+' pago único o '+esc(p.rent)+' como renta/piloto.</p></section><section class="v82-section"><h4>Demo de 3–5 minutos desde el celular</h4><div class="v82-process">'+f.demo.map((x,n)=>'<div class="v82-step"><span>0'+(n+1)+'</span><b>'+esc(x)+'</b></div>').join('')+'</div></section><section class="v82-section"><h4>Cierre sugerido</h4><div class="v82-close"><b>No pidas que compre de inmediato:</b><br>'+esc(f.close)+'</div></section><section class="v82-section"><div class="v82-seller"><b>EVITA ESTO EN PERSONA</b><br>'+esc(f.avoid)+'</div></section>'}
          '''

          if 'const FIELD_PLAYBOOKS=[' not in text:
              if marker not in text:
                  raise SystemExit('Could not locate proposal open() marker')
              replacement = field_code + "\n" + marker.replace("body(p)", "fieldBody(i,p)+body(p)")
              text = text.replace(marker, replacement, 1)
          else:
              text = text.replace("innerHTML=body(p)", "innerHTML=fieldBody(i,p)+body(p)", 1)

          text = text.replace("b.textContent='Ver propuesta'", "b.textContent='Propuesta presencial'", 1)
          text = text.replace('PROPUESTA DE CAMPO · V8.2', 'PROPUESTA PRESENCIAL · V8.4', 1)
          text = text.replace('Diseñada para enseñarla desde el teléfono durante una visita.', 'Guion de campo + preguntas + 3 propuestas + demo y cierre para enseñarlo desde el teléfono.', 1)

          if text == original:
              raise SystemExit('No changes applied')
          path.write_text(text, encoding='utf-8')
          print('Presencial playbooks added.')

      - name: Publish and remove one-shot workflow
        run: |
          rm -f .github/workflows/radar-presencial-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/index.html
          git add .github/workflows/radar-presencial-once.yml
          git commit -m "feat: add in-person proposal playbooks to Radar"
          git push origin HEAD:radar-local-host
