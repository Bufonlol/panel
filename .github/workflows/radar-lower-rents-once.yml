name: Radar lower proposal rents once

on:
  push:
    branches: [radar-local-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 5

      - name: Lower proposal rents and publish
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          weekly=Path('weekly-prospecting-os-v8.js')
          s=weekly.read_text(encoding='utf-8')
          repl={
            "rent:'$700–$1,000/mes',setup:'$1,000–$2,000'":"rent:'$490–$790/mes',setup:'$700–$1,200'",
            "rent:'$1,000–$1,600/mes',setup:'$1,500–$2,500'":"rent:'$790–$1,100/mes',setup:'$1,000–$1,500'",
            "rent:'$700–$900/mes',setup:'$1,000–$1,500'":"rent:'$490–$690/mes',setup:'$700–$1,000'",
            "rent:'$600–$900/mes',setup:'$1,000–$1,500'":"rent:'$490–$690/mes',setup:'$700–$1,000'",
            "rent:'$900–$1,200/mes',setup:'$1,500–$2,000'":"rent:'$690–$890/mes',setup:'$900–$1,200'",
          }
          for a,b in repl.items():
            if a in s: s=s.replace(a,b,1)
          weekly.write_text(s,encoding='utf-8')

          p=Path('field-proposal-patch-v8_2.js')
          s=p.read_text(encoding='utf-8')
          repl={
            "rent:'$790/mes',rentText:'Recomendada para validar. Puesta en marcha desde $1,200":"rent:'$590/mes',rentText:'Recomendada para validar. Puesta en marcha desde $800",
            "rent:'$1,200/mes',rentText:'Setup desde $2,000":"rent:'$890/mes',rentText:'Setup desde $1,200",
            "rent:'$790/mes',rentText:'Setup desde $1,200 con soporte.'":"rent:'$590/mes',rentText:'Setup desde $800 con soporte.'",
            "rent:'$690/mes',rentText:'Setup desde $1,200 con hosting y mantenimiento pequeño.'":"rent:'$590/mes',rentText:'Setup desde $800 con hosting y mantenimiento pequeño.'",
            "rent:'$990/mes',rentText:'Setup desde $1,500 con soporte.'":"rent:'$790/mes',rentText:'Setup desde $1,000 con soporte.'",
          }
          for a,b in repl.items():
            if a in s: s=s.replace(a,b,1)
          p.write_text(s,encoding='utf-8')

          import subprocess
          subprocess.run(['node','build-radar-v3.cjs'],check=True)
          out=Path('dist/index.html').read_text(encoding='utf-8')
          checks=['$490–$790/mes','$790–$1,100/mes','$490–$690/mes','$690–$890/mes',"rent:'$590/mes'",'v84OpenBusinessPlaybook']
          missing=[x for x in checks if x not in out]
          if missing: raise SystemExit('Missing in build: '+', '.join(missing))
          print('Lower proposal rents validated')
          PY
          rm -f .github/workflows/radar-lower-rents-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weekly-prospecting-os-v8.js field-proposal-patch-v8_2.js .github/workflows/radar-lower-rents-once.yml
          git add -f dist/index.html
          git commit -m 'fix: lower Radar proposal rent pricing'
          git push origin HEAD:radar-local-host
