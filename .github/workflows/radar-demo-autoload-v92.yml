name: Radar demo autoload V9.2
on:
  push:
    branches: [radar-local-host]
    paths:
      - 'demo-autoload-hotfix-v9_2.js'
      - '.github/workflows/radar-demo-autoload-v92.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
      - name: Wire, validate and publish V9.2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-radar-v3.cjs')
          s=p.read_text()
          load="vm.runInThisContext(fs.readFileSync('demo-autoload-hotfix-v9_2.js','utf8'),{filename:'demo-autoload-hotfix-v9_2.js'});"
          if load not in s:
              anchor="vm.runInThisContext(fs.readFileSync('visit-itinerary-patch-v9_1.js','utf8'),{filename:'visit-itinerary-patch-v9_1.js'});"
              s=s.replace(anchor,anchor+'\n'+load)
          apply="html=window.patchRadarDemoAutoloadV92(html);"
          if apply not in s:
              anchor="html=window.patchRadarVisitItineraryV91(html);"
              s=s.replace(anchor,anchor+'\n'+apply)
          old="if(!html.includes('radarVisitItineraryV91')||!html.includes('v91-agenda')||!html.includes('Weekly Prospecting OS V9.1')||!html.includes('Armar horario'))throw new Error('V9.1 sequential itinerary missing');"
          new="if(!html.includes('radarVisitItineraryV91')||!html.includes('v91-agenda')||!html.includes('Armar horario'))throw new Error('V9.1 sequential itinerary missing');"
          s=s.replace(old,new)
          check="if(!html.includes('radarDemoAutoloadV92')||!html.includes('Weekly Prospecting OS V9.2')||!html.includes('Cargando demo'))throw new Error('V9.2 demo autoload missing');"
          if check not in s:
              s=s.replace(new,new+'\n'+check)
          s=s.replace("console.log('Radar Local V9.1 built:'","console.log('Radar Local V9.2 built:'")
          p.write_text(s)
          PY
          node build-radar-v3.cjs
          grep -q 'Radar Local — Weekly Prospecting OS V9.2' dist/index.html
          grep -q 'radarDemoAutoloadV92' dist/index.html
          grep -q 'Cargando demo' dist/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-radar-v3.cjs
          git add -f dist/index.html
          git commit -m 'fix: publish COYO demo autoload V9.2'
          git push origin radar-local-host
