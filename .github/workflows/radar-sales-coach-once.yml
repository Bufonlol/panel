name: Radar sales coach once

on:
  push:
    branches: [radar-local-host]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
          fetch-depth: 5
      - name: Add objection coach and follow-up
        shell: python
        run: |
          from pathlib import Path
          p=Path('deep-research-playbook-patch-v8_4.js')
          s=p.read_text(encoding='utf-8')
          css_old='.v84-source-chip{display:inline-flex;padding:3px 6px;border-radius:999px;background:#eef5ff;color:#3164a8;font-size:7px;font-weight:800;margin-left:5px}'
          css_new=css_old+'.v84-objections{display:grid;gap:8px}.v84-objection{border:1px solid #e1e7ef;border-radius:10px;padding:10px;background:#fff}.v84-objection b{display:block;font-size:8.5px;color:#8b4b24;margin-bottom:4px}.v84-objection p{font-size:8.5px;color:#4f5f74;margin:0;line-height:1.5}.v84-follow{padding:11px 12px;border-radius:10px;background:#f7f9ff;border:1px solid #d8e2f4;font-size:9px;line-height:1.55;color:#40546f}'
          if '.v84-objections{' not in s:
            if css_old not in s: raise SystemExit('CSS anchor missing')
            s=s.replace(css_old,css_new,1)
          old="function body(b,p){const evidence=Array.isArray(p.evidence)?p.evidence:[],qs=Array.isArray(p.questions)?p.questions:[],features=Array.isArray(p.features)?p.features:[],demo=Array.isArray(p.demo)?p.demo:[];return "
          new="function body(b,p){const evidence=Array.isArray(p.evidence)?p.evidence:[],qs=Array.isArray(p.questions)?p.questions:[],features=Array.isArray(p.features)?p.features:[],demo=Array.isArray(p.demo)?p.demo:[],objections=Array.isArray(p.objections)?p.objections:[];return "
          if 'objections=Array.isArray(p.objections)' not in s:
            if old not in s: raise SystemExit('body declaration anchor missing')
            s=s.replace(old,new,1)
          anchor='<section class=\"v82-section\"><h4>Cierre</h4><div class=\"v82-close\">\'+esc(p.close||\'\')+\'</div></section><section class=\"v82-section\"><div class=\"v82-seller\"><b>NO HAGAS ESTO</b><br>\'+esc(p.avoid||\'\')+\'</div></section>'
          replacement='<section class=\"v82-section\"><h4>Cierre</h4><div class=\"v82-close\">\'+esc(p.close||\'\')+\'</div></section><section class=\"v82-section\"><h4>Si te dice esto → responde esto</h4><div class=\"v84-objections\">\'+(objections.length?objections.map(x=>\'<div class=\"v84-objection\"><b>“\'+esc(x.objection||\'Objeción\')+\'”</b><p>\'+esc(x.answer||\'\')+\'</p></div>\').join(\'\'):\'<div class=\"v84-mini\">Todavía no hay objeciones preparadas para este prospecto.</div>\')+\'</div></section><section class=\"v82-section\"><h4>Si hoy no cierra</h4><div class=\"v84-follow\">\'+esc(p.follow_up||\'Pide permiso para enviarle un resumen y acuerda un día concreto para volver a escribirle.\')+\'</div></section><section class=\"v82-section\"><div class=\"v82-seller\"><b>NO HAGAS ESTO</b><br>\'+esc(p.avoid||\'\')+\'</div></section>'
          if 'Si te dice esto → responde esto' not in s:
            if anchor not in s: raise SystemExit('body section anchor missing')
            s=s.replace(anchor,replacement,1)
          plain_old="'','CIERRE',p.close||'','', 'EVITAR',p.avoid||''"
          plain_new="'','CIERRE',p.close||'','', 'OBJECIONES',...(p.objections||[]).map(x=>'• '+(x.objection||'Objeción')+': '+(x.answer||'')),'','SEGUIMIENTO',p.follow_up||'','', 'EVITAR',p.avoid||''"
          if "'OBJECIONES'" not in s:
            if plain_old not in s: raise SystemExit('plain anchor missing')
            s=s.replace(plain_old,plain_new,1)
          p.write_text(s,encoding='utf-8')
        
      - name: Build and validate
        run: |
          node build-radar-v3.cjs
          grep -q 'Si te dice esto → responde esto' dist/index.html
          grep -q 'SEGUIMIENTO' dist/index.html
          grep -q 'target:10' dist/index.html
      - name: Publish
        run: |
          rm -f .github/workflows/radar-sales-coach-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deep-research-playbook-patch-v8_4.js .github/workflows/radar-sales-coach-once.yml
          git add -f dist/index.html
          git commit -m 'feat: add beginner objection coach and follow-up scripts'
          git pull --rebase origin radar-local-host
          git push origin HEAD:radar-local-host
