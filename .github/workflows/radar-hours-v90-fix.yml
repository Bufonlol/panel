name: Radar hours V9.0 fix
on:
  push:
    branches: [radar-local-host]
    paths:
      - '.github/workflows/radar-hours-v90-fix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: radar-local-host
      - name: Wire, validate and publish V9.0
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build-radar-v3.cjs')
          s=p.read_text()
          load="vm.runInThisContext(fs.readFileSync('visit-hours-patch-v9_0.js','utf8'),{filename:'visit-hours-patch-v9_0.js'});"
          anchor_load="vm.runInThisContext(fs.readFileSync('visit-mobile-detail-patch-v8_9.js','utf8'),{filename:'visit-mobile-detail-patch-v8_9.js'});"
          if load not in s:
              s=s.replace(anchor_load,anchor_load+'\n'+load)
          apply="html=window.patchRadarVisitHoursV90(html);"
          anchor_apply="html=window.patchRadarVisitMobileV89(html);"
          if apply not in s:
              s=s.replace(anchor_apply,anchor_apply+'\n'+apply)
          old="if(!html.includes('radarVisitMobileV89')||!html.includes('v89-detail')||!html.includes('Weekly Prospecting OS V8.9'))throw new Error('V8.9 mobile visit detail missing');"
          new="if(!html.includes('radarVisitMobileV89')||!html.includes('v89-detail'))throw new Error('V8.9 mobile visit detail missing');"
          s=s.replace(old,new)
          check="if(!html.includes('radarVisitHoursV90')||!html.includes('v90-hours')||!html.includes('Weekly Prospecting OS V9.0'))throw new Error('V9.0 business hours missing');"
          if check not in s:
              s=s.replace(new,new+'\n'+check)
          s=s.replace("console.log('Radar Local V8.9 built:'","console.log('Radar Local V9.0 built:'")
          p.write_text(s)
          PY
          node build-radar-v3.cjs
          grep -q 'Radar Local — Weekly Prospecting OS V9.0' dist/index.html
          grep -q 'radarVisitHoursV90' dist/index.html
          grep -q 'MEJOR VENTANA' dist/index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-radar-v3.cjs
          git add -f dist/index.html
          git commit -m 'feat: publish Radar visit hours V9.0'
          git push origin radar-local-host
