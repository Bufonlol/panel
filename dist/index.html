<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<title>Radar Local</title>
<style>
html,body{height:100%;margin:0;background:#f5f7fb;font-family:Inter,system-ui,sans-serif;color:#526176}.boot{height:100%;display:grid;place-items:center;padding:20px}.boot-card{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:18px 22px;box-shadow:0 12px 35px rgba(28,44,76,.08);max-width:360px}.boot-card b{display:block;color:#172033;margin-bottom:5px}.boot-card small{line-height:1.45}
</style>
</head>
<body>
<div class="boot"><div class="boot-card"><b>Preparando Radar Local…</b><small>Activando modo de visitas ligero V10.16.</small></div></div>
<script>
(async function(){
try{
  const BASE='https://raw.githubusercontent.com/Bufonlol/panel/f436002ae84486940407f0703488826d7d56845e/dist/index.html';
  const r=await fetch(BASE,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  let html=await r.text();
  html=html.replace("const observer=new MutationObserver(function(){installMobileNav();installDesktopNav();installWeekEntry();repairDemoButtons()});setTimeout(function(){boot();const app=document.querySelector('.app')||document.body;observer.observe(app,{childList:true,subtree:true})},120);setInterval(repairDemoButtons,1200);","setTimeout(boot,120);");
  html=html.replace("const root=document.getElementById('visitsView')||document.body;new MutationObserver(function(){setTimeout(decorate,0)}).observe(root,{childList:true,subtree:true});setTimeout(decorate,250);setInterval(decorate,1000);","setTimeout(decorate,250);");
  html=html.replace("root.innerHTML='<div class=\"visit-empty\"><div><h2>Cargando prospectos…</h2><p>Radar está preparando los datos del mapa y la investigación.</p></div></div>';setTimeout(render,700);return","root.innerHTML='<div class=\"visit-empty\"><div><h2>Ruta ligera disponible</h2><p>El mapa puede seguir cargando en segundo plano.</p></div></div>';updateHeader();return");
  const css=`
  .rvl-page{height:100%;overflow:auto;padding:15px 14px 110px;background:#f5f7fb;color:#172033}.rvl-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:11px}.rvl-kicker{font-size:9px;font-weight:950;letter-spacing:.08em;color:#1769e0}.rvl-head h1{font-size:25px;line-height:1.05;margin:3px 0 5px;letter-spacing:-.04em}.rvl-head p{font-size:9px;color:#748195;margin:0;line-height:1.5}.rvl-badge{flex:0 0 auto;padding:7px 9px;border-radius:999px;background:#e9f8f1;color:#08764a;font-size:8px;font-weight:900}.rvl-note{padding:10px 11px;border:1px solid #d9e3ef;border-radius:11px;background:#fff;font-size:8px;line-height:1.5;color:#5d6d82;margin-bottom:10px}.rvl-note b{color:#263b57}.rvl-shell{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:10px}.rvl-card,.rvl-route{background:#fff;border:1px solid #e1e7ef;border-radius:14px;box-shadow:0 8px 24px rgba(28,44,76,.05)}.rvl-card{padding:14px}.rvl-route{padding:10px;align-self:start}.rvl-type{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:7px;font-weight:950}.rvl-type.cafe{background:#fff5df;color:#8a631e}.rvl-type.dental{background:#eaf3ff;color:#315f91}.rvl-card h2{font-size:23px;margin:8px 0 4px;letter-spacing:-.04em}.rvl-card>p{font-size:9px;color:#6e7c90;margin:0}.rvl-script{margin-top:12px;padding:11px;border-radius:10px;background:#f8fbff;border:1px solid #dbe8f7;font-size:10px;line-height:1.55;color:#40546e}.rvl-actions{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:7px;margin-top:11px}.rvl-btn{border:1px solid #dfe6ef;background:#fff;border-radius:10px;padding:11px 9px;font-size:9px;font-weight:900;color:#4b5d74}.rvl-btn.primary{background:#1769e0;border-color:#1769e0;color:#fff}.rvl-btn.done{background:#edf9f3;border-color:#bfe5d2;color:#08764a}.rvl-nav{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.rvl-route h3{font-size:10px;margin:2px 3px 8px}.rvl-list{display:grid;gap:5px}.rvl-stop{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:7px;align-items:center;text-align:left;border:1px solid #edf1f5;background:#fff;border-radius:9px;padding:7px;color:#263448}.rvl-stop.on{border-color:#98bce9;background:#f4f8ff}.rvl-stop.done{border-color:#c9e5d7;background:#f4fbf7}.rvl-num{width:24px;height:24px;border-radius:8px;background:#edf2f8;display:grid;place-items:center;font-size:7px;font-weight:950}.rvl-stop b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rvl-stop small{display:block;font-size:6.5px;color:#7b8797;margin-top:1px}.rvl-state{font-size:12px}.rvl-visited{margin-top:9px;padding:8px;border-radius:9px;background:#f7f8fa;color:#707b89;font-size:6.8px;line-height:1.5}
  @media(max-width:900px){.rvl-shell{grid-template-columns:1fr}.rvl-route{order:2}.rvl-list{display:flex;overflow:auto;padding-bottom:3px}.rvl-stop{flex:0 0 195px}.rvl-page{padding:14px 12px 105px}.rvl-head h1{font-size:24px}}
  @media(max-width:600px){.rvl-actions{grid-template-columns:1fr 1fr}.rvl-actions .primary{grid-column:1/-1}.rvl-card h2{font-size:21px}}
  `;
  const patch=`(function(){
  if(window.__RADAR_VISIT_LITE_V1016__)return;window.__RADAR_VISIT_LITE_V1016__=true;
  var TODAY='2026-08-18',STORE='radar_visit_lite_2026_08_18';
  var ROUTE=[
   {key:'neutral',name:'Neutral',kind:'cafe'},
   {key:'nurena',name:'Clínica Dental Nureña',kind:'dental'},
   {key:'mr-rocco',name:'Mr Rocco',kind:'cafe'},
   {key:'del-angel',name:'Clínica Dental Del Ángel',kind:'dental'},
   {key:'maria-bonita',name:'María Bonita',kind:'cafe'},
   {key:'odontologica-mexicana',name:'Clínica Odontológica Mexicana',kind:'dental'},
   {key:'don-gerardo',name:'Café Don Gerardo',kind:'cafe'},
   {key:'orthodent',name:'Orthodent',kind:'dental'},
   {key:'vero',name:'Cafetería Vero',kind:'cafe'},
   {key:'la-concordia',name:'Dental La Concordia',kind:'dental'}
  ];
  var ALREADY=['Cafetería El Gallo','Ameyalli','Café La Abuelita','Cafenatlán','Vive Café Veracruz','Wego Coffee & Beer','Café Café Bistro','Breve','Viva Latte','Bate y Late'];
  function localDate(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  function load(){try{var x=JSON.parse(localStorage.getItem(STORE)||'null');return x&&typeof x==='object'?x:{index:0,done:{}}}catch(e){return{index:0,done:{}}}}
  var state=load();state.done=state.done||{};if(!Number.isInteger(state.index))state.index=0;
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
  function esc(v){return String(v||'').replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
  function scriptFor(x){return x.kind==='dental'?'Trabajo con sistemas para clínicas que centralizan agenda, confirmaciones y seguimiento. ¿Está quien lleva la operación? Tarda 30 segundos.':'Estoy mostrando una idea sencilla para cafeterías locales para que los clientes regresen y pidan directo. ¿Está la persona encargada? Tarda 30 segundos.'}
  function count(){return ROUTE.filter(function(x){return state.done[x.key]}).length}
  function nextPending(from,dir){var n=ROUTE.length;for(var s=1;s<=n;s++){var i=(from+dir*s+n)%n;if(!state.done[ROUTE[i].key])return i}return Math.max(0,Math.min(n-1,from))}
  function view(){var v=document.getElementById('visitsView');if(!v){var main=document.querySelector('.main');if(!main)return null;v=document.createElement('section');v.id='visitsView';v.className='view';main.appendChild(v)}return v}
  function render(){var v=view();if(!v)return;state.index=Math.max(0,Math.min(ROUTE.length-1,state.index));var x=ROUTE[state.index],done=state.done[x.key];v.innerHTML='<div class="rvl-page"><div class="rvl-head"><div><div class="rvl-kicker">MODO VISITAS · V10.16</div><h1>Salir a vender</h1><p>Martes · abre sin esperar los 6,000 negocios del mapa.</p></div><div class="rvl-badge">'+count()+'/'+ROUTE.length+' gestionados</div></div><div class="rvl-note"><b>Ruta actualizada:</b> ya no repite lo que visitaste. <b>Neutral sigue pendiente.</b></div><div class="rvl-shell"><main class="rvl-card"><span class="rvl-type '+x.kind+'">'+(x.kind==='dental'?'DENTAL':'CAFETERÍA')+'</span><h2>'+esc(x.name)+'</h2><p>Orizaba · parada '+(state.index+1)+' de '+ROUTE.length+(done?' · '+esc(done.label):'')+'</p><div class="rvl-script"><b>Entrada:</b> '+esc(scriptFor(x))+'</div><div class="rvl-actions"><button class="rvl-btn primary" data-rvl-map="'+state.index+'">Abrir Maps</button><button class="rvl-btn done" data-rvl-done="'+state.index+'">✓ Visitado</button><button class="rvl-btn" data-rvl-skip="'+state.index+'">Saltar</button></div><div class="rvl-nav"><button class="rvl-btn" data-rvl-prev>← Anterior</button><button class="rvl-btn" data-rvl-next>Siguiente →</button></div></main><aside class="rvl-route"><h3>Ruta pendiente · 5 cafés + 5 dentales</h3><div class="rvl-list">'+ROUTE.map(function(r,i){var d=state.done[r.key];return '<button class="rvl-stop'+(i===state.index?' on':'')+(d?' done':'')+'" data-rvl-jump="'+i+'"><span class="rvl-num">'+(i+1)+'</span><span><b>'+esc(r.name)+'</b><small>'+(r.kind==='dental'?'Dental':'Cafetería')+'</small></span><span class="rvl-state">'+(d?(d.status==='skip'?'↷':'✓'):'')+'</span></button>'}).join('')+'</div><div class="rvl-visited"><b>Ya fuera:</b> '+ALREADY.map(esc).join(' · ')+'</div></aside></div></div>'}
  function show(){var v=view();if(!v)return;document.querySelectorAll('.view').forEach(function(n){n.classList.remove('on')});v.classList.add('on');document.querySelectorAll('.navbtn').forEach(function(n){n.classList.toggle('on',n.dataset.module==='visits')});document.querySelectorAll('[data-v871-module]').forEach(function(n){n.classList.toggle('on',n.dataset.v871Module==='visits')});render()}
  function maps(i){var x=ROUTE[Number(i)||0];if(x)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(x.name+' Orizaba Veracruz'),'_blank','noopener')}
  function mark(i,status,label){i=Number(i)||0;var x=ROUTE[i];if(!x)return;state.done[x.key]={status:status,label:label,at:new Date().toISOString()};state.index=nextPending(i,1);save();render()}
  document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-rvl-map],[data-rvl-done],[data-rvl-skip],[data-rvl-prev],[data-rvl-next],[data-rvl-jump]');if(!t)return;if(t.dataset.rvlMap!=null){maps(t.dataset.rvlMap);return}if(t.dataset.rvlDone!=null){mark(t.dataset.rvlDone,'done','Visitado');return}if(t.dataset.rvlSkip!=null){mark(t.dataset.rvlSkip,'skip','Saltado');return}if(t.hasAttribute('data-rvl-prev')){state.index=(state.index-1+ROUTE.length)%ROUTE.length;save();render();return}if(t.hasAttribute('data-rvl-next')){state.index=nextPending(state.index,1);save();render();return}if(t.dataset.rvlJump!=null){state.index=Math.max(0,Math.min(ROUTE.length-1,Number(t.dataset.rvlJump)||0));save();render()}},false);
  document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-v871-module="visits"],.navbtn[data-module="visits"],[data-visit-open]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();show()},true);
  setTimeout(function(){var base=window.setModule;if(typeof base==='function'&&!base.__rvl){var fn=function(v){if(v==='visits'&&localDate()===TODAY){show();return}return base.apply(this,arguments)};fn.__rvl=true;window.setModule=fn;try{setModule=fn}catch(e){}}if(window.radarVisitModeV88)window.radarVisitModeV88.open=show},180);
  window.radarVisitLiteV1016={version:'10.16',open:show,render:render,route:ROUTE.slice()};
  })();`;
  const styleTag='<sty'+'le>'+css+'<'+'/sty'+'le>';
  const scriptTag='<scr'+'ipt>'+patch+'<'+'/scr'+'ipt>';
  html=html.replace('</head>',styleTag+'</head>');
  html=html.replace('</body>',scriptTag+'</body>');
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  location.replace(url);
}catch(e){
 document.body.innerHTML='<div class="boot"><div class="boot-card"><b>No se pudo iniciar Radar.</b><small>'+String(e&&e.message||e)+'</small></div></div>';
}
})();
</script>
</body>
</html>
